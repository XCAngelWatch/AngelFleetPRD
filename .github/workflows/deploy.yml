name: Publish PRD documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['docs/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Archive generated site
        uses: actions/upload-artifact@v4
        with:
          name: angelfleet-prd-site-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          PAGE_URL="${PAGE_URL%/}/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PAGE_URL" -o /tmp/angelfleet-index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${PAGE_URL}build-manifest.json" -o /tmp/angelfleet-manifest.json
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/angelfleet-manifest.json')).version")"
          grep -q "v${VERSION}" /tmp/angelfleet-index.html
          node -e "const m=require('/tmp/angelfleet-manifest.json'); if(m.chapters.length < 20 || m.diagrams < 8) process.exit(1)"

name: Publish PRD documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['docs/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Archive generated site
        uses: actions/upload-artifact@v4
        with:
          name: angelfleet-prd-site-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Read expected publication
        uses: actions/download-artifact@v4
        with:
          name: angelfleet-prd-site-${{ github.run_id }}
          path: expected-site
      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node -e "const m=require('./expected-site/build-manifest.json'); const files=new Set(['build-manifest.json','sitemap.xml',...m.readingPages.flatMap(p=>[p.file,p.markdown]),...m.supportingDocs]); console.log([...files].join('\n'))" > "$RUNNER_TEMP/angelfleet-files"
          while IFS= read -r file; do
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 15 "${PAGE_URL%/}/${file}?rev=${GITHUB_SHA}&attempt=${attempt}" -o "$RUNNER_TEMP/angelfleet-smoke" &&
                 cmp -s "$RUNNER_TEMP/angelfleet-smoke" "expected-site/$file"; then
                echo "Verified $file"
                break
              fi
              if [[ "$attempt" == 12 ]]; then
                echo "::error::Published $file does not match this build"
                exit 1
              fi
              sleep 5
            done
          done < "$RUNNER_TEMP/angelfleet-files"
